## Deskripsi

Project ini merupakan tugas praktikum Pemrograman Mobile menggunakan Flutter. Aplikasi terdiri dari beberapa bagian praktikum dan tugas yang dapat diakses melalui menu utama.

## Daftar Praktikum

1. **Praktikum A – Input Dasar**  
   Mempelajari input data pengguna dan menampilkan sapaan berdasarkan nama.

2. **Praktikum B – Form Validation**  
   Mempelajari pembuatan formulir, validasi input, pemilihan kategori, dan persetujuan pengguna.

3. **Praktikum C – State Management**  
   Mempelajari pengelolaan state menggunakan `StatefulWidget` dan `setState()` melalui aplikasi penghitung angka.

4. **Praktikum D – To-Do List**  
   Mempelajari pengelolaan daftar tugas, menandai tugas selesai, dan menghapus tugas.

5. **Tugas – Shopping List**  
   Membuat aplikasi daftar belanja dengan pengelolaan state menggunakan Provider.

## Teknologi yang Digunakan

- Flutter
- Bahasa pemrograman Dart
- Material Design
- Provider untuk pengelolaan state pada tugas Shopping List

