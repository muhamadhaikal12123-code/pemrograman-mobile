## Cara Menjalankan Aplikasi

1. Buka folder project `pertemuan_3` di VS Code.
2. Pastikan Flutter SDK sudah terpasang.
3. Jalankan perintah berikut di terminal:

```bash
flutter pub get
flutter run
```

4. Pilih emulator Android yang tersedia.
5. Gunakan menu utama untuk membuka setiap bagian praktikum dan tugas.

## Kesimpulan

Melalui project ini, mahasiswa mempelajari dasar pembuatan aplikasi mobile menggunakan Flutter, mulai dari input pengguna, validasi formulir, pengelolaan state, daftar tugas, hingga penggunaan Provider.